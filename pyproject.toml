[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slacheck"
version = "0.2.0"
description = "Check availability commitments against a service dependency graph."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Wassim Badraoui" }]
keywords = ["sre", "slo", "availability", "opentelemetry", "openslo"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Live Datadog integration (Phase 3+). The offline pipeline does NOT need these.
datadog = ["datadog-api-client>=2.20"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
docs = ["mkdocs>=1.6,<2"]
showcase = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/Wassbdr/slcmca"
Issues = "https://github.com/Wassbdr/slcmca/issues"
Changelog = "https://github.com/Wassbdr/slcmca/blob/showcase/2026-11/CHANGELOG.md"

[project.scripts]
slacheck = "slacheck.cli:app"

[tool.setuptools]
packages = [
    "slacheck",
    "slacheck.dashboard",
    "slacheck.datadog",
    "slacheck.envelope",
    "slacheck.envelope.v2",
    "slacheck.eval",
    "slacheck.graph",
    "slacheck.eval_fixtures.global_slo",
    "slacheck.eval_fixtures.sub_slo",
    "slacheck.eval_fixtures.reconfig",
]

[tool.setuptools.package-dir]
"" = "src"
# Ship the 113-scenario eval dataset so `slacheck eval` works outside the checkout.
"slacheck.eval_fixtures" = "fixtures/eval"

[tool.setuptools.package-data]
"slacheck.eval_fixtures.global_slo" = ["*.yaml"]
"slacheck.eval_fixtures.sub_slo" = ["*.yaml"]
"slacheck.eval_fixtures.reconfig" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real Datadog API (require DD_API_KEY/DD_APP_KEY); skipped by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's API intentionally calls Option()/Argument() in parameter defaults.
"src/slacheck/cli.py" = ["B008"]
# the eval generator inserts src/ on sys.path before importing slacheck (E402 intentional).
"scripts/gen_eval.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
packages = ["slacheck"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
