name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]"
      - run: make check
      - name: Table I totals from the installed CLI, outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          slacheck eval --both | tee eval.txt
          grep -E '^Total +113 +67$' eval.txt
          grep -E '^Total +113 +113$' eval.txt
      - name: Example topology flags the payment provider at 99.9%
        run: |
          set +e
          slacheck check examples/shop.yaml --slo 99.9 | tee check.txt
          test "${PIPESTATUS[0]}" = 1 && grep -q 'payment: availability' check.txt

  docs-and-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]"
      - run: make docs
      - uses: ./
        with:
          topology: examples/shop-openslo.yaml
          graph: examples/shop.yaml
          upload-sarif: "false"
      - uses: ./
        id: infeasible
        continue-on-error: true
        with:
          topology: examples/shop-openslo.yaml
          graph: examples/shop.yaml
          slo: "99.94"
          upload-sarif: "false"
      - name: Verify the infeasible gate
        env:
          OUTCOME: ${{ steps.infeasible.outcome }}
          SARIF_FILE: ${{ steps.infeasible.outputs.sarif-file }}
        run: |
          test "$OUTCOME" = failure
          jq -e '.runs[0].results[0].ruleId == "availability.infeasible"' "$SARIF_FILE"
