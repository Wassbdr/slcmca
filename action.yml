name: Check availability commitment
description: Fail a topology change when the entrypoint cannot meet its declared availability SLO.
inputs:
  topology:
    description: Path to a topology YAML file or an OpenSLO v1 bundle.
    required: true
  graph:
    description: Path to the topology YAML for an OpenSLO bundle.
    required: false
    default: ""
  slo:
    description: Optional availability target override, as a percentage.
    required: false
    default: ""
  slo-name:
    description: Optional OpenSLO objective selection.
    required: false
    default: ""
  upload-sarif:
    description: Upload findings to GitHub code scanning. Requires security-events write access.
    required: false
    default: "true"
outputs:
  sarif-file:
    description: Local path to the SARIF report, if the check produced one.
    value: ${{ steps.check.outputs.sarif-file }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install slacheck
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: python -m pip install "$ACTION_DIR"
    - name: Check topology
      id: check
      shell: bash
      env:
        TOPOLOGY: ${{ inputs.topology }}
        GRAPH: ${{ inputs.graph }}
        TARGET: ${{ inputs.slo }}
        SLO_NAME: ${{ inputs.slo-name }}
      run: |
        args=(check --independent --format sarif)
        if [[ -n "$GRAPH" ]]; then args+=(--graph "$GRAPH"); fi
        if [[ -n "$TARGET" ]]; then args+=(--slo "$TARGET"); fi
        if [[ -n "$SLO_NAME" ]]; then args+=(--slo-name "$SLO_NAME"); fi
        report="$(mktemp "$RUNNER_TEMP/slacheck.XXXXXX.sarif")"
        status=0
        slacheck "${args[@]}" -- "$TOPOLOGY" > "$report" || status=$?
        printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
        if [[ -s "$report" ]]; then
          printf 'sarif-file=%s\n' "$report" >> "$GITHUB_OUTPUT"
        fi
    - uses: github/codeql-action/upload-sarif@v4
      if: ${{ steps.check.outputs.sarif-file != '' && inputs.upload-sarif == 'true' }}
      with:
        sarif_file: ${{ steps.check.outputs.sarif-file }}
        category: slacheck
    - name: Enforce commitment
      if: ${{ always() }}
      shell: bash
      env:
        CHECK_STATUS: ${{ steps.check.outputs.status }}
      run: exit "${CHECK_STATUS:-2}"
